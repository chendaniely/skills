# Made from plan-driven-development's template. Kickoff replaces __PROJECT__, __SITE_URL__ and
# __REPO_URL__. The pages show the repo's own files through includes and wrappers (AGENTS.md, Docs and security).
project:
  type: website
  output-dir: _site

website:
  title: "__PROJECT__"
  site-url: "__SITE_URL__"
  repo-url: "__REPO_URL__"
  repo-subdir: website
  navbar:
    right:
      - text: Repo
        menu:
          - text: Architecture
            href: architecture.qmd
          - text: Design
            href: design.qmd
          - text: Changelog
            href: changelog.md
          - text: How we work
            href: how-we-work.md

format:
  html:
    theme: cosmo
    toc: true
    mermaid:
      theme: neutral
    include-after-body: _diagram-zoom.html
